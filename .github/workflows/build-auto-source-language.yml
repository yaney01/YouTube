name: Patch auto source language runtime

on:
  push:
    branches:
      - agent/fix-auto-source-language

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-auto-source-language
      - name: Patch runtime bundles
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('archive/js/v1.3/YouTube.request.js'),
              Path('archive/js/v1.3/YouTube.response.js'),
          ]
          old = '"DualSubs","YouTube",'
          new = '"DualSubs",["YouTube"],'
          for path in files:
              content = path.read_text()
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 runtime environment call, found {count}')
              path.write_text(content.replace(old, new, 1))
          PY
          node --check archive/js/v1.3/YouTube.request.js
          node --check archive/js/v1.3/YouTube.response.js
      - name: Commit runtime bundles
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add archive/js/v1.3/YouTube.request.js archive/js/v1.3/YouTube.response.js
          git commit -m "build: patch YouTube runtime language scope"
          git push
