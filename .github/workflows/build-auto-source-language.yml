name: Build auto source language branch

on:
  push:
    branches:
      - auto-source-language
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "rspack.config.js"
      - ".github/workflows/build-auto-source-language.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "rspack.config.js"
      - ".github/workflows/build-auto-source-language.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Commit bundles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/request.bundle.js dist/response.bundle.js
          if git diff --cached --quiet; then
            echo "Bundles are already up to date."
            exit 0
          fi
          git commit -m "build: update auto source bundles [skip ci]"
          git push origin HEAD:auto-source-language
