name: Build auto source language fix

on:
  push:
    branches:
      - agent/fix-auto-source-language
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        id: install
        shell: bash
        run: |
          set +e
          npm install --legacy-peer-deps --no-audit --no-fund > npm-install.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: npm-install-log
          path: npm-install.log
      - name: Check dependency installation
        if: steps.install.outputs.code != '0'
        run: exit 1
      - run: npm run build
      - name: Update runtime bundles
        run: |
          cp dist/request.bundle.js archive/js/v1.3/YouTube.request.js
          cp dist/response.bundle.js archive/js/v1.3/YouTube.response.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add archive/js/v1.3/YouTube.request.js archive/js/v1.3/YouTube.response.js
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh YouTube runtime scripts"
            git push
          fi
