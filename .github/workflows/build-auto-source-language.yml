name: Build auto source language branch

on:
  push:
    branches:
      - auto-source-language
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "rspack.config.js"
      - ".github/workflows/build-auto-source-language.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: auto-source-language
          fetch-depth: 0
          submodules: false

      - name: Restore protobuf compatibility files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src/protobuf
          mkdir -p src/protobuf
          base="https://raw.githubusercontent.com/DualSubs/YouTube/65b9a005acbe032500ebd5bbb7e5ec1a203c852b/src/protobuf"
          curl --fail --silent --show-error --location "$base/player.request.js" --output src/protobuf/player.request.js
          curl --fail --silent --show-error --location "$base/browse.request.js" --output src/protobuf/browse.request.js
          curl --fail --silent --show-error --location "$base/get_watch.response.js" --output src/protobuf/get_watch.response.js
          curl --fail --silent --show-error --location "$base/player.response.js" --output src/protobuf/player.response.js

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: npm

      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build bundles
        run: npm run build

      - name: Commit bundles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force dist/request.bundle.js dist/response.bundle.js
          if git diff --cached --quiet; then
            echo "Bundles are already up to date."
            exit 0
          fi
          git commit -m "build: update auto source bundles [skip ci]"
          git push origin HEAD:auto-source-language
